<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ error_title }} - Student Performance Analyzer</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    {% set active_page = '' %}
    {% include '_sidebar.html' %}
    <main class="main-content">
        <section class="panel error-panel" role="status">
            <p class="eyebrow">ERROR {{ error_code }}</p>
            <h1>{{ error_title }}</h1>
            <p>{{ error_message }}</p>
            <div class="form-actions">
                <a class="button button-primary" href="{{ url_for('home') }}">Back to Dashboard</a>
                <a class="button button-secondary" href="{{ url_for('students') }}">Student Directory</a>
            </div>
        </section>
    </main>
</body>
</html>
